name: Manual Code Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-code-verification-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify repository code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository identity
        run: |
          echo "repository=${GITHUB_REPOSITORY}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node project
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            PM=pnpm
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
            PM=yarn
          elif [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit
            PM=npm
          else
            npm install --legacy-peer-deps --no-audit
            PM=npm
          fi
          export PM
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const pm = process.env.PM || 'npm';
          const scripts = pkg.scripts || {};
          const targets = ['typecheck','test','build'];
          let ran = 0;
          for (const name of targets) {
            if (!scripts[name]) continue;
            ran++;
            console.log(`\n=== ${pm} ${name} ===`);
            const args = pm === 'npm' ? ['run', name] : ['run', name];
            const r = cp.spawnSync(pm, args, {stdio:'inherit', env:{...process.env, CI:'true'}});
            if (r.status !== 0) process.exit(r.status || 1);
          }
          if (!ran) console.log('No root typecheck/test/build scripts found; install verification only.');
          NODE

      - name: Setup Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python project
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          if [ -d tests ] && python -c 'import pytest' 2>/dev/null; then python -m pytest -q; fi

      - name: Setup Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Go project
        if: ${{ hashFiles('go.mod') != '' }}
        run: go test ./...

      - name: Verify Rust project
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: cargo test --locked

      - name: Verification summary
        if: always()
        run: echo "Manual verification finished for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
